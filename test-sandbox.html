<!DOCTYPE html>
<html>
<body>
  <iframe id="f1" sandbox="allow-scripts" srcdoc="<script>window.addEventListener('message', e => parent.postMessage('f1: ' + (e.source === window.parent), '*'));</script>"></iframe>
  <iframe id="f2" sandbox="allow-scripts allow-same-origin" srcdoc="<script>window.addEventListener('message', e => parent.postMessage('f2: ' + (e.source === window.parent), '*'));</script>"></iframe>
  <script>
    window.addEventListener('message', e => console.log(e.data));
    setTimeout(() => {
      document.getElementById('f1').contentWindow.postMessage('hi', '*');
      document.getElementById('f2').contentWindow.postMessage('hi', '*');
    }, 500);
  </script>
</body>
</html>
