name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Check Formatting & Linting
        run: bun run check
        if: matrix.os == 'ubuntu-latest' # Only run linting once to save time

      - name: Typecheck
        run: bun run typecheck

      - name: Verify Build
        run: bun run build
        
      - name: Run Unit Tests
        # Wait until build is done if tests depend on built assets, though usually they don't.
        run: bun run test

      - name: Verify Docs Build
        run: bun run build:docs
        if: matrix.os == 'ubuntu-latest' # Docs build just needs to be verified once
      
      - name: Run E2E CLI Smoke Test
        # The E2E test will rely on the build being completed first.
        run: bun test test/e2e.test.ts
